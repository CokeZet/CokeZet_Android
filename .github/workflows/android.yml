name: CokeZet CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # JDK 설치 17버전 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      # gradlew 실행 권한 부여
      - name: Grant permission to Gradle
        run: chmod +x ./gradlew

      # 전체 모듈 빌드
      - name: Build all modules (assembleDebug)
        run: ./gradlew assembleDebug

      # Detekt 검사
      # import문 삭제 경고, 변수는 카멜케이스, 클래스틑 파스칼케이스
      # const val은 대문자 + 언더바 형식 ex) const val USER_DATA_STORE
      - name: Run Detekt
        run: ./gradlew detekt
